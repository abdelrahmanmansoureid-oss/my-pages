<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio Club Digital Gate Pass - youssef abdelmonem</title>
    <style>
        :root {
            --rio-green: #38b449;
            --rio-dark-blue: #1b427b;
            --rio-orange: #f27e1f;
            --pass-main-bg: #0d2139;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-primary: #334e6e;
            --ticket-border: #f1b36e;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e2e8f0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .page-container {
            width: 380px; height: 700px;
            position: relative; display: flex;
            justify-content: center; align-items: center;
            overflow: hidden; border-radius: 20px;
        }
        .pass-card {
            width: 90%; height: 90%;
            background-color: var(--pass-main-bg);
            border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            color: var(--text-primary); position: relative;
            display: flex; flex-direction: column;
            overflow: hidden; border: 2px solid var(--ticket-border);
        }
        .card-top-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 30%;
            background-image: linear-gradient(to right, #4ade80, #1d4ed8 50%, #fb923c);
            z-index: 1; clip-path: ellipse(80% 50% at 50% -10%);
        }
        .logo-section {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; margin-top: 15px; z-index: 10;
        }
        .logo-section svg { width: 100px; height: auto; margin-bottom: 5px; }
        .logo-title { font-size: 28px; font-weight: bold; margin: 0; color: var(--text-primary); }
        .pass-type { font-size: 16px; color: var(--text-secondary); margin-top: 0; margin-bottom: 20px; }
        .main-entrance-text { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .info-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; width: 90%; margin: 0 auto; margin-bottom: 25px;
        }
        .info-item { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
        .info-label { font-size: 14px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .info-value { font-size: 20px; font-weight: bold; }
        .primary-guest .info-value { font-size: 24px; margin-top: 5px; text-align: center; }
        .access-tier .info-value {
            background-image: linear-gradient(to right, var(--rio-green), var(--rio-orange));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 24px; text-transform: capitalize; line-height: 1.2; text-align: center;
        }
        .arrival-date .info-value { font-size: 24px; color: var(--rio-orange); }
        .pass-footer {
            margin-top: auto; border-top: 1px solid var(--border-primary);
            padding: 15px 0; display: flex; justify-content: center;
            align-items: center; gap: 10px; position: relative;
        }
        .ticket-id { font-family: 'Courier New', Courier, monospace; font-size: 16px; color: var(--text-secondary); }
        .valid-dot { width: 10px; height: 10px; background-color: var(--rio-green); border-radius: 50%; }
        .valid-text { font-size: 16px; font-weight: bold; color: var(--rio-green); text-transform: uppercase; }
        .pass-card::before, .pass-card::after {
            content: ''; position: absolute; top: 50%; width: 20px; height: 20px;
            background-color: #e2e8f0; border: 2px solid var(--ticket-border); border-radius: 50%; z-index: 5;
        }
        .pass-card::before { left: -10px; transform: translateY(-50%); }
        .pass-card::after { right: -10px; transform: translateY(-50%); }
    </style>
</head>
