<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio Club Pass - عمر شريف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Cairo', sans-serif; }
        * { font-family: 'Cairo', sans-serif; }
        :root {
            --rio-green: #38b449;
            --rio-dark-blue: #1b427b;
            --rio-orange: #f27e1f;
            --pass-main-bg: #0d2139;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-primary: #334e6e;
            --ticket-border: #f1b36e;
        }
        .pass-card { width: 340px; height: 640px; background-color: var(--pass-main-bg); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: var(--text-primary); position: relative; display: flex; flex-direction: column; overflow: hidden; border: 2px solid var(--ticket-border); }
        .card-top-bg { position: absolute; top: 0; left: 0; width: 100%; height: 30%; background-image: linear-gradient(to right, #4ade80, #1d4ed8 50%, #fb923c); z-index: 1; clip-path: ellipse(80% 50% at 50% -10%); }
        .logo-section { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 15px; z-index: 10; }
        .logo-section svg { width: 75px; height: auto; margin-bottom: 5px; }
        .logo-title { font-size: 26px; font-weight: bold; margin: 0; color: var(--text-primary); }
        .pass-type { font-size: 14px; color: var(--text-secondary); margin-top: 0; margin-bottom: 15px; letter-spacing: 0.5px; }
        .main-entrance-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 90%; margin: 0 auto; margin-bottom: 16px; }
        .info-item { display: flex; flex-direction: column; align-items: center; padding: 6px 0; }
        .info-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .info-value { font-size: 16px; font-weight: bold; }
        .primary-guest .info-value { font-size: 20px; margin-top: 2px; text-align: center; }
        .access-tier .info-value { background-image: linear-gradient(to right, var(--rio-green), var(--rio-orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 15px; text-transform: capitalize; line-height: 1.2; text-align: center; }
        .arrival-date .info-value { font-size: 16px; color: var(--rio-orange); }
        .pass-footer { margin-top: auto; border-top: 1px solid var(--border-primary); padding: 12px 0; display: flex; justify-content: center; align-items: center; gap: 10px; position: relative; }
        .ticket-id { font-family: 'Courier New', Courier, monospace; font-size: 13px; color: var(--text-secondary); }
        .valid-dot { width: 9px; height: 9px; background-color: var(--rio-green); border-radius: 50%; }
        .valid-text { font-size: 14px; font-weight: bold; color: var(--rio-green); }
        .pass-card::before, .pass-card::after { content: ''; position: absolute; top: 50%; width: 18px; height: 18px; background-color: #0f172a; border: 2px solid var(--ticket-border); border-radius: 50%; z-index: 5; }
        .pass-card::before { left: -10px; transform: translateY(-50%); }
        .pass-card::after { right: -10px; transform: translateY(-50%); }
    </style>
</head>
<body>
    <div class="pass-card" id="passCardElement" style="direction: rtl;">
                <div class="card-top-bg"></div>

                <div class="logo-section">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="z-10 drop-shadow-md">
                        <polygon points="50,5 92,25 92,75 50,95 8,75 8,25" fill="#1C5AA0"></polygon>
                        <polygon points="50,14 84,30 84,70 50,86 16,70 16,30" fill="#0d2139"></polygon>
                        <circle cx="50" cy="48" r="18" fill="#38b449"></circle>
                        <path d="M36,52 Q50,26 64,52" stroke="#f27e1f" stroke-width="4.5" fill="none" stroke-linecap="round"></path>
                        <circle cx="50" cy="48" r="6" fill="#ffffff"></circle>
                    </svg>
                    <p class="logo-title">RIO</p>
                    <p class="pass-type" id="previewPassType">تصريح النادي</p>
                </div>

                <p class="main-entrance-text text-center z-10" id="previewEntranceText">المدخل الرئيسي</p>

                <div class="info-grid z-10">
                    <div class="info-item primary-guest col-span-2">
                        <span class="info-label" id="cardLabelPrimary">العضو الأساسي</span>
                        <span class="info-value" id="previewName">عمر شريف</span>
                    </div>
                    <div class="info-item col-span-2">
                        <span class="info-label" id="cardLabelPayment">تاريخ السداد</span>
                        <span class="info-value text-base text-center" style="color:var(--rio-green)" id="previewPaymentDate">—</span>
                    </div>
                    <div class="info-item col-span-2">
                        <span class="info-label" id="cardLabelCompanions">المرافقين</span>
                        <span id="previewChildren" style="font-size:13px;font-weight:600;color:#cbd5e1;text-align:center;line-height:1.5;">—</span>
                    </div>
                    <div class="info-item access-tier">
                        <span class="info-label" id="cardLabelID">كود الاشتراك</span>
                        <span class="info-value" id="previewID">RIO-TICK-1234</span>
                    </div>
                    <div class="info-item arrival-date">
                        <span class="info-label" id="cardLabelDate">تاريخ الحجز</span>
                        <span class="info-value" id="previewDate">٢٤ مايو ٢٠٢٦</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label" id="cardLabelFamily">أفراد الأسرة</span>
                        <span class="info-value" id="previewFamilyCount">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label" id="cardLabelGuests">الضيوف</span>
                        <span class="info-value" id="previewGuests">4</span>
                    </div>
                </div>

                <div class="pass-footer z-10">
                    <div class="valid-dot"></div>
                    <span class="ticket-id" id="previewFooterID">RIO-TICK-1234</span>
                    <span class="valid-text" id="previewValidText">صالح</span>
                </div>
            </div>
</body>
</html>
